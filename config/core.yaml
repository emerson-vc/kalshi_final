# Core sweeps: combo patterns that are swept every run, for every QB / top receiver / team in every
# game with markets open. They get the "core" share of the RFQ budget (default 50%), split between the
# sweeps below by ``share`` (in this order; a sweep's unused share flows to the next one). Only combos
# inside the payout band (Learning tab, default 8x-50x) are sent; rungs nearest the middle of the band
# go first.
#
# A sweep is two legs (either order), YES side on both, same team, each with:
#   kind           Kalshi stat kind (pass_td, team_total, anytime_td, pass_yds, rec_yds, h1_spread, ml)
#   positions      optional player positions (QB, WR, TE, RB)
#   min / max      threshold window on the "over X" line (pass TD 3+ is threshold 2.5; team o24.5 is 24.5)
#   around_main    only rungs within this many points of the team's main line (the ~50% rung)
#   top_receivers  only each team's top N receivers, ranked by anytime-TD price (nflverse target share
#                  when a receiver has no TD market)
# Edit freely; the next scan picks the change up.

sweeps:
  qb_ptd_x_team_total:
    label: QB pass TD × own team total
    share: 0.40
    a: {kind: pass_td, positions: [QB], min: 2.5, max: 3.5}     # 3+, 4+ (5+ is explore-only)
    b: {kind: team_total, around_main: 7}                       # own team total, main line ± 7

  qb_pyds_x_rec_yds:
    label: QB yds × own WR/TE rec yds
    share: 0.25
    a: {kind: pass_yds, positions: [QB], min: 274.5, max: 324.5}               # 275+, 300+, 325+
    b: {kind: rec_yds, positions: [WR, TE], min: 99.5, max: 189.5, top_receivers: 2}  # 100+ … 190+

  rec_td_x_team_total:
    label: WR/TE TD × own team total
    share: 0.20
    a: {kind: anytime_td, positions: [WR, TE], min: 1.5, top_receivers: 2}     # 2+, 3+
    b: {kind: team_total, min: 17.5, max: 31.5}

  ml_x_h1_lead:
    label: Team ML × 1H lead
    share: 0.15
    a: {kind: h1_spread, min: 2.5}                              # wins 1H by 2.5+ … 13.5+
    b: {kind: ml}
