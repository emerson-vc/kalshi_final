[project]
name = "combo-edge"
version = "1.0.0"
description = "Kalshi NFL same-game combo edge scanner: RFQ price discovery, learning, and gated (paper-by-default) execution."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "cryptography>=43",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "polars>=1.0",
    "nflreadpy>=0.1.5",
    "pyyaml>=6.0",
]

[project.scripts]
combo-edge = "combo_edge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["combo_edge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*", "ignore:Using `httpx` with `starlette.testclient`"]
